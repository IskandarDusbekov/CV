# /etc/nginx/sites-available/tezrezyume  (tezrezyume.uz o'rniga o'z domeningizni yozing)
# SSL ni certbot o'zi qo'shadi: sudo certbot --nginx -d tezrezyume.uz -d www.tezrezyume.uz

upstream tezrezyume_app {
    server unix:/run/tezrezyume/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name tezrezyume.uz www.tezrezyume.uz;

    client_max_body_size 12M;

    # To'lov cheklari — faqat admin panel orqali (Django tekshiradi)
    location /media/receipts/ {
        deny all;
        return 404;
    }

    location /media/ {
        alias /home/tezrezyume/app/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location /static/ {
        alias /home/tezrezyume/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://tezrezyume_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # PDF yaratish va AI so'rovlari uchun
        proxy_read_timeout 130s;
        proxy_connect_timeout 10s;
    }
}
